<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sistema de Produção de Aulas — TI TOTAL</title>
</head>
<body>
<div id="app-root"></div>
<style>
  :root{
    --navy:#002060; --navy2:#14275C; --blue:#0E57C4; --blue-soft:#2E5BD6;
    --ice:#EAF1FB; --line:#E2E8F0; --ink:#1B2430; --muted:#64748B;
    --ok:#1E8E3E; --ok-soft:#E7F5EC; --warn:#C77700; --warn-soft:#FCF3E3;
    --red:#C00000; --bg:#F4F7FC; --card:#FFFFFF;
    --font-title:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  #app-root{font-family:var(--font-body);color:var(--ink);background:var(--bg);min-height:100vh;font-size:15px;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3,h4,.t{font-family:var(--font-title);letter-spacing:.2px}
  a{color:var(--blue);text-decoration:none}
  button{font-family:var(--font-body);cursor:pointer;border:none;border-radius:9px;font-size:14px}
  .btn{background:var(--blue);color:#fff;padding:10px 16px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn:hover{background:var(--blue-soft)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.ok{background:var(--ok)} .btn.ok:hover{filter:brightness(1.05)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c9}
  /* header */
  header.top{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 60%,#1c3a86 100%);color:#fff;box-shadow:0 2px 10px rgba(0,32,96,.18)}
  header.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:800;font-size:18px;letter-spacing:.5px}
  .logo .hex{width:30px;height:30px;border:2px solid #7fb0ff;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#bcd6ff;transform:rotate(0deg)}
  .logo small{font-weight:500;color:#b9cdf2;font-size:11px;letter-spacing:2px;display:block;margin-top:-3px}
  header.top nav{margin-left:auto;display:flex;gap:6px}
  header.top nav button{background:rgba(255,255,255,.08);color:#eaf1fb;padding:8px 14px;font-weight:600}
  header.top nav button.active,header.top nav button:hover{background:rgba(255,255,255,.20);color:#fff}
  /* layout */
  .page{padding:26px 0 60px}
  .pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h1{font-size:24px;margin:0;color:var(--navy)}
  .pagehead .sub{color:var(--muted);font-size:14px}
  .spacer{flex:1}
  /* cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,32,64,.05)}
  .aula-card{cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .aula-card:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(14,87,196,.12);transform:translateY(-2px)}
  .aula-card .disc{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .aula-card h3{margin:4px 0 8px;font-size:18px;color:var(--navy)}
  .aula-card .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .prog{height:9px;background:var(--ice);border-radius:20px;overflow:hidden}
  .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));border-radius:20px;transition:width .4s}
  .prog-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:8px;color:var(--muted)}
  .prog-row b{color:var(--navy)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill.todo{background:#eef1f6;color:#5b6b82}
  .pill.doing{background:var(--warn-soft);color:var(--warn)}
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  /* empty */
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px}
  /* new-aula card */
  .new-card{border:2px dashed #c3d3ec;background:#fbfdff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--blue);cursor:pointer;min-height:150px;font-weight:700;text-align:center;padding:16px}
  .new-card:hover{border-color:var(--blue);background:#f2f7ff}
  .new-card .plus{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px}
  .new-card.transform{border-color:#e7c58a;color:var(--warn);background:#fffdf7}
  .new-card.transform:hover{border-color:var(--warn);background:#fff8ec}
  .new-card.transform .plus{background:var(--warn);font-size:20px}
  .badge-transf{display:inline-flex;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .origem-box{background:#fff8ec;border:1px solid #f0dcb5;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#8a5a00;margin-top:8px}
  /* aula detail */
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:12px;cursor:pointer}
  .backlink:hover{color:var(--blue)}
  .aula-hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:20px;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .aula-hero .disc{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .aula-hero h1{margin:3px 0 6px;font-size:23px;color:var(--navy)}
  .aula-hero .esc{color:var(--muted);font-size:13.5px;max-width:620px}
  .ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--ice) 0);flex-shrink:0}
  .ring .in{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
  .ring .in b{font-size:22px;color:var(--navy);font-family:var(--font-title)}
  .ring .in span{font-size:10.5px;color:var(--muted)}
  /* stepper */
  .trilha-h{font-family:var(--font-title);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:800;margin:22px 0 8px;padding-left:2px;display:flex;align-items:center;gap:10px}
  .trilha-h:before{content:"";height:1px;background:var(--line);flex:1;order:2}
  .step{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;transition:.15s}
  .step.done{border-left:4px solid var(--ok)}
  .step.doing{border-left:4px solid var(--warn)}
  .step.todo{border-left:4px solid #cdd7e6}
  .step-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
  .step-head:hover{background:#fafcff}
  .step-num{width:38px;height:38px;border-radius:10px;background:var(--ice);color:var(--navy);font-family:var(--font-title);font-weight:800;display:grid;place-items:center;font-size:13px;flex-shrink:0}
  .step.done .step-num{background:var(--ok);color:#fff}
  .step.doing .step-num{background:var(--warn);color:#fff}
  .step-head .nm{font-weight:700;color:var(--navy);font-size:15.5px}
  .step-head .rp{font-size:12.5px;color:var(--muted);margin-top:2px}
  .step-head .chev{margin-left:auto;color:var(--muted);transition:.2s;font-size:13px}
  .step.open .chev{transform:rotate(90deg)}
  .step-body{display:none;padding:4px 20px 20px 20px;border-top:1px solid var(--line);background:#fcfdff}
  .step.open .step-body{display:block}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .block-lbl{font-family:var(--font-title);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:16px 0 7px}
  .obj{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
  .chk{list-style:none;margin:0;padding:0}
  .chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed #eef2f8}
  .chk li:last-child{border-bottom:none}
  .chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--ok);flex-shrink:0;cursor:pointer}
  .chk label{cursor:pointer;font-size:14px}
  .chk li.on label{color:var(--muted);text-decoration:line-through}
  .exit{background:var(--ok-soft);border:1px solid #cdead6;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#1c6b34}
  .exit b{color:var(--ok)}
  .manual-box{background:linear-gradient(180deg,#f0f6ff,#f7fbff);border:1px solid #d5e4fb;border-radius:11px;padding:13px 15px;font-size:13px;margin-top:6px}
  .manual-box .mh{font-family:var(--font-title);font-weight:800;color:var(--blue);font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .manual-box ul{margin:6px 0 0;padding-left:18px} .manual-box li{margin:3px 0}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--font-body);font-size:14px;color:var(--ink);background:#fff}
  .fld textarea{min-height:66px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,87,196,.12)}
  .links{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .link-row{display:flex;gap:6px}
  .link-row input{flex:1}
  .link-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ice);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--navy);margin:3px 6px 3px 0}
  .link-chip a{font-weight:600}
  .link-chip .x{cursor:pointer;color:var(--muted);font-weight:700}
  .btn.ia-run{background:linear-gradient(100deg,#6d28d9,#7c3aed);color:#fff}
  .btn.ia-run:hover{filter:brightness(1.08)}
  .ia-badge{display:inline-flex;align-items:center;gap:4px;background:#ede9fe;color:#6d28d9;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:.2px;margin-left:8px}
  .ia-note{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:11px 14px;font-size:13px;color:#5b21b6;margin-top:6px}
  .cmd{background:#faf5ff;border:1px dashed #c4b5fd;border-radius:8px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#4c1d95;margin:8px 0;word-break:break-word}
  .logwrap{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .logrow{position:relative;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:7px 26px 7px 10px}
  .logts{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .logtx{font-size:13px;color:var(--ink);white-space:pre-wrap}
  .logx{position:absolute;top:6px;right:8px;cursor:pointer;color:#c3ccda;font-weight:700;font-size:12px}
  .logx:hover{color:var(--red)}
  .step-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .tag-time{font-size:12px;color:var(--muted);background:#f1f5fb;padding:3px 9px;border-radius:7px}
  .timerbox{margin-top:8px;font-size:12px;color:var(--muted);background:#f1f5fb;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:7px}
  .timerbox .timer-lbl{white-space:nowrap}
  .timerbox .timer-live{color:var(--ink);font-variant-numeric:tabular-nums}
  .btn.timer-go{background:#0E57C4;color:#fff;border-color:#0E57C4}
  .btn.timer-stop{background:#fdecec;color:#b42318;border-color:#f3b9b4}
  .uploadbox{margin-top:14px;padding:14px;border:1.5px dashed var(--blue);border-radius:12px;background:#f7faff}
  .uploadbox .btn.upbtn{margin-top:10px;background:#0E57C4;color:#fff;border-color:#0E57C4}
  .upstatus{margin-top:8px} .upstatus.err{color:#b42318}
  .uplist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .uprow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .uprow a{color:var(--blue);font-weight:600;text-decoration:none}
  .uprow .x{margin-left:auto;cursor:pointer;color:var(--muted);font-weight:700}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 4px;color:var(--navy);font-size:20px}
  .modal .mx{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;margin:-6px -4px 0 0}
  .modal-wide{max-width:760px}
  .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  /* padroes reference */
  .ref-sec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .ref-sec > h4{margin:0;padding:12px 16px;background:#f7faff;font-size:14px;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:8px}
  .ref-sec .rb{padding:8px 16px 14px;font-size:13.5px;display:none}
  .ref-sec.open .rb{display:block}
  .ref-sec ul{margin:6px 0;padding-left:18px} .ref-sec li{margin:4px 0}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:5px}
  .badge-tag{display:inline-block;background:var(--ice);color:var(--navy);border-radius:7px;padding:3px 9px;margin:3px 5px 3px 0;font-size:12.5px;font-weight:600}
  .kb{font-size:12px;color:var(--muted);margin-top:6px}
  .metrics{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 18px}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px}
  .metric b{font-size:22px;color:var(--navy);font-family:var(--font-title);display:block}
  .metric span{font-size:12px;color:var(--muted)}
  .foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>

<script>
(function(){
  "use strict";
  const LS_KEY="titotal_sistema_aulas_v1";
  const $=s=>document.querySelector(s);
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  // ---------- MANUAL reference (padrões) ----------
  const MANUAL={
    tipografia:["<b>Títulos/subtítulos:</b> Montserrat","<b>Corpo:</b> Segoe UI 12px"],
    layout:["<b>Página:</b> A4, margens “Normal” 2,5 cm","<b>Parágrafo:</b> recuo 0 · 6pt depois · entrelinhas 1,15","<b>Cabeçalho:</b> linha contínua","<b>Rodapé:</b> logo TI TOTAL centralizado + número de página à direita"],
    paleta:['<span class="swatch" style="background:#0E57C4"></span><b>Negrito azul</b> = o que <b>é</b> (núcleo conceitual: definição, característica principal, ideia-chave)','<span class="swatch" style="background:#C00000"></span><b>Negrito vermelho</b> = o que <b>não é</b> (negação, exclusão, armadilha, limite da definição)','<b>Negrito</b> (preto) = termo/propriedade sendo definida','<b>Regra de ouro:</b> azul = o que é · vermelho = o que não é. Nunca colorir frase inteira sem função semântica.'],
    tags:["Essencial de Prova","Atenção","Bizu","Dica","Exemplificando","Esclarecendo","Esquema","Questões"],
    estrutura:["Capa","Apresentação","Sumário","Seções de conteúdo","Essencial de prova","Esquemas de aula","Mapa mental","Glossário de termos","Referências"],
    secoes:["Essencial de prova","Contextualização","Conceito","Explicação","Exemplos","Quadros","Esquema","Questões"],
    comentarios:["<b>Resolução</b> (justificativa; itens isolados como Correto/Incorreto quando for o caso)","<b>Correção da assertiva</b> ↺","<b>Teoria</b> 📘","<b>Gabarito</b> (Certo/Errado ou Letra, com cor)"],
    tqr:"Metodologia <b>TQR</b>: Teoria → Questões → Revisão. A aula final são <b>3 PDFs</b>: Teoria, Questões (comentadas) e Revisão (essencial de prova + esquemas + mapa mental)."
  };

  // ---------- 14 etapas do Processo ----------
  const STEPS=[
    {id:"e1",num:"1.1",trilha:"Planejamento",nome:"Planejamento da aula",resp:"Arquiteto da disciplina",tempo:"2h",
     obj:"Definir a estrutura pedagógica da aula e selecionar as questões que orientarão a produção.",
     ativ:["Definir o título da aula e sua posição na estrutura do curso.","Delimitar o escopo: quais tópicos entram e quais ficam para outras aulas.","Estruturar os tópicos em seções lógicas e progressivas.","Indicar sugestão de número de páginas."],
     res:"Arquitetura pedagógica da aula definida."},
    {id:"e2",num:"1.2",trilha:"Planejamento",nome:"Favoritar questões",resp:"Estagiário",tempo:"4h",
     obj:"Selecionar as questões que orientarão a produção.",
     ativ:["Pesquisar questões recentes das principais bancas (Cebraspe, FGV, FCC, Vunesp).","Selecionar entre 200 e 250 questões representativas do tema.","Priorizar as mais recentes.","Favoritar no TEC dentro dos tópicos definidos."],
     res:"Questões relevantes favoritadas no TEC."},
    {id:"e3",num:"1.3",trilha:"Questões",nome:"Criação dos cadernos de questões",resp:"Assistente editorial / IA",tempo:"1h",
     obj:"Transformar as questões favoritas no TEC em cadernos organizados (produção + estudo dos alunos).",
     ativ:["Acessar as questões favoritadas no TEC.","Criar o caderno geral da aula (todas as favoritadas).","Criar cadernos gerais por banca principal (CEBRASPE, FCC, FGV).","Criar caderno por tópico.","Criar cadernos por tópico para cada banca principal."],
     res:"Cadernos de questões organizados no TEC."},
    {id:"e3r",num:"1.3.1",trilha:"Questões",nome:"Revisão da criação dos cadernos (humana)",resp:"Revisão humana",tempo:"30min",
     obj:"Toda entrega feita pela IA passa por revisão humana. Aqui, conferir manualmente os cadernos criados pela IA no TEC antes de seguir para a etapa seguinte.",
     ativ:["Conferir se todos os cadernos previstos foram criados (por tópico, integradas e geral da aula).","Verificar as contagens de questões de cada caderno.","Conferir a nomenclatura padronizada (Caderno TI TOTAL - SI0X - ...).","Excluir os cadernos de teste/duplicados sinalizados pela IA.","Validar que as bancas sem questões foram corretamente puladas.","Confirmar que todos estão na pasta correta."],
     res:"Cadernos revisados e aprovados por um humano."},
    {id:"e4",num:"1.4",trilha:"Questões",nome:"Preparação editorial de questões",resp:"Assistente editorial / IA",tempo:"1h",manual:"q",
     obj:"Transpor entre 100 e 200 questões dos cadernos para o Word.",
     ativ:["Exportar questões do TEC.","Colocar no template Word: separadas por tópico e por banca, em ordem decrescente de ano.","Preparar estrutura de comentário: espaço para justificativa (itens isolados Correto/Incorreto quando for o caso).","Preparar espaço para teoria e para o gabarito."],
     res:"Documento Word organizado para comentários."},

  function load(){

    return {aulas:[]};

let __saveT=null;function save(){clearTimeout(__saveT);__saveT=setTimeout(()=>{fetch('/api/db',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)}).then(r=>{if(r.status===401)location.reload();}).catch(()=>{});},250);}
  function getAula(id){return DB.aulas.find(a=>a.id===id);}
  function blankEtapa(){return {status:"todo",resp:"",checks:[],notas:"",links:[],doneAt:null};}
  function ensure(a){ // migrate/ensure etapa objects
    a.etapas=a.etapas||{};
    STEPS.forEach(s=>{ if(!a.etapas[s.id]) a.etapas[s.id]=blankEtapa();
      const e=a.etapas[s.id]; if(!Array.isArray(e.checks))e.checks=[]; if(!Array.isArray(e.links))e.links=[]; if(!Array.isArray(e.log))e.log=[];
      if(typeof e.timeSpent!=='number')e.timeSpent=0;
      if(e.timerStart&&(Date.now()-e.timerStart)>288e5)e.timerStart=null; // descarta cronômetro esquecido (>8h)
    });
    return a;
  }
  function addLog(a,s,text){const e=a.etapas[s.id];e.log=e.log||[];e.log.push({ts:Date.now(),text:text});save();}
  function fmtTs(ts){const d=new Date(ts);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
  function fmtSize(n){n=n||0;if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(0)+" KB";return (n/1048576).toFixed(1)+" MB";}
  function UploadBox(a,s,e){
    if(!Array.isArray(e.uploads))e.uploads=[];
    const box=el("div","uploadbox");
    box.appendChild(el("div","block-lbl","⬆ Enviar arquivo para a IA (ex.: caderno em PDF com gabarito)"));
    box.appendChild(el("div","small muted","O arquivo que você subir aqui fica salvo no sistema e a IA consegue ler direto — sem precisar do chat."));
    const status=el("div","upstatus small");
    const list=el("div","uplist");
    function draw(){
      list.innerHTML="";
      if(!e.uploads.length){list.appendChild(el("div","small muted","Nenhum arquivo enviado ainda."));return;}
      e.uploads.forEach((u,i)=>{
        const row=el("div","uprow");
        row.innerHTML='📄 <a href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(u.name)+'</a> <span class="small muted">('+fmtSize(u.size)+')</span>';
        const x=el("span","x","✕");x.onclick=()=>{e.uploads.splice(i,1);save();draw();};
        row.appendChild(x);list.appendChild(row);
      });
    }
    const fi=el("input");fi.type="file";fi.accept=".pdf,.doc,.docx,.txt";fi.style.display="none";
    const btn=el("button","btn upbtn","⬆ Subir arquivo");
    btn.onclick=()=>fi.click();
    fi.onchange=async()=>{
      const f=fi.files[0];if(!f)return;
      status.className="upstatus small";status.textContent="Enviando "+f.name+"…";
      try{
        const blobMod=await import('https://esm.sh/@vercel/blob@2.8.0/client');
        const pth='uploads/'+safeSeg(a.id)+'/'+safeSeg(f.name);
        const bl=await blobMod.upload(pth,f,{access:'public',handleUploadUrl:'/api/upload',multipart:f.size>8*1024*1024});
        const d={ok:true,name:safeSeg(f.name),size:f.size,url:bl.url};
        if(d&&d.ok){
          const ex=e.uploads.findIndex(u=>u.name===d.name);const rec={name:d.name,size:d.size,url:d.url,ts:Date.now()};
          if(ex>=0)e.uploads[ex]=rec;else e.uploads.push(rec);
          addLog(a,s,"Arquivo enviado no sistema: "+d.name+" ("+fmtSize(d.size)+").");
          save();draw();status.textContent="✓ Enviado: "+d.name;
        }else{status.className="upstatus small err";status.textContent="Erro ao enviar o arquivo.";}
      }catch(err){
        status.className="upstatus small err";
        status.textContent="⚠ Não foi possível enviar o arquivo: "+(err&&err.message?err.message:"erro desconhecido");
      }
      fi.value="";
    };
    box.appendChild(btn);box.appendChild(fi);box.appendChild(status);box.appendChild(list);
    // sincroniza com o servidor (arquivos já enviados)
    fetch('/api/uploads?aula='+encodeURIComponent(safeSeg(a.id)),{credentials:'include'}).then(r=>r.json()).then(d=>{
      if(d&&Array.isArray(d.files)){const names=new Set(e.uploads.map(u=>u.name));
        d.files.forEach(f=>{if(!names.has(f.name))e.uploads.push({name:f.name,size:f.size,url:f.url});});draw();}
    }).catch(()=>{});
    draw();
    return box;
  }
  function safeSeg(x){return String(x||'').replace(/[^\w\-. ()À-ſ]/g,'_');}
  function fmtDur(ms){const m=Math.floor((ms||0)/60000);if(m<60)return m+"min";return Math.floor(m/60)+"h "+(m%60)+"min";}
  function timerCur(e){return (e.timeSpent||0)+(e.timerStart?(Date.now()-e.timerStart):0);}
  function progress(a){ensure(a);let d=0;STEPS.forEach(s=>{if(a.etapas[s.id].status==="done")d++;});return {done:d,total:STEPS.length,pct:Math.round(d/STEPS.length*100)};}
  // criar a aula no painel JÁ é a etapa 1.1 (Planejamento) -> marca como concluída
  function completeStep1(a){const s=STEPS.find(x=>x.id==="e1");const e=a.etapas.e1;

    e.notas=e.notas||("Definido ao criar a aula no painel."+(a.paginas?(" Sugestão: ~"+a.paginas+" págs."):""));}
  function statusOf(a,s){return a.etapas[s.id].status;}
  function curStep(a){for(const s of STEPS){if(a.etapas[s.id].status!=="done")return s;}return null;}

  function Painel(w){
    const ph=el("div","pagehead");

    c.innerHTML=`
      <div class="disc">${esc(a.disciplina||"—")} ${a.tipo==="transformacao"?'<span class="badge-transf">↺ Transformação</span>':''}</div>

  function updateRing(a){const p=progress(a);const r=document.getElementById("aula-ring");

  function updateStepChrome(a,s){const e=a.etapas[s.id];
    const row=document.querySelector('.step[data-step="'+s.id+'"]');
    if(row){row.className="step "+e.status+(openSteps.has(s.id)?" open":"");

    updateRing(a);}

  function StepRow(a,s){
    const e=a.etapas[s.id];const st=e.status;
    const open=openSteps.has(s.id);
    const row=el("div","step "+st+(open?" open":""));
    row.setAttribute("data-step",s.id);
    const head=el("div","step-head");
    const pill=`<span class="pill ${st}"><span class="dot"></span>${st==="done"?"Feito":st==="doing"?"Fazendo":"A fazer"}</span>`;
    const isIA=/IA/.test(s.resp);
    head.innerHTML=`<div class="step-num">${s.num.replace("1.","")}</div>
      <div style="flex:1"><div class="nm">${esc(s.nome)}${isIA?'<span class="ia-badge">🤖 IA</span>':''}</div><div class="rp">👤 ${esc(s.resp)} · ⏱ ${esc(s.tempo)}</div></div>

    row.appendChild(head);

  function GuidedBody(a,s){
    const e=a.etapas[s.id];
    const box=el("div","");
    const g=el("div","grid2");

    // LEFT: objetivo, atividades(checklist), critério de saída, padrões
    const left=el("div","");
    left.appendChild(el("div","block-lbl","Objetivo"));
    left.appendChild(el("div","obj",esc(s.obj)));
    left.appendChild(el("div","block-lbl","Atividades / checklist"));
    const ul=el("ul","chk");
    s.ativ.forEach((t,i)=>{
      const li=el("li",e.checks[i]?"on":"");
      const cid="c_"+a.id+"_"+s.id+"_"+i;
      li.innerHTML=`<input type="checkbox" id="${cid}" ${e.checks[i]?"checked":""}><label for="${cid}">${esc(t)}</label>`;
      li.querySelector("input").onchange=ev=>{e.checks[i]=ev.target.checked;
        // auto status: doing if some checked & not done
        if(e.status!=="done"){e.status=e.checks.some(Boolean)?"doing":"todo";}
        save();li.className=ev.target.checked?"on":"";updateStepChrome(a,s);};
      ul.appendChild(li);
    });
    left.appendChild(ul);
    left.appendChild(el("div","block-lbl","Critério de saída (resultado)"));
    left.appendChild(el("div","exit",`<b>✓ Pronto quando:</b> ${esc(s.res)}`));

    if(s.manual){left.appendChild(ManualBox(s.manual));}
    if(s.upload){left.appendChild(UploadBox(a,s,e));}

    // RIGHT: responsável, tempo, notas, links
    const right=el("div","");
    right.appendChild(el("div","block-lbl","Responsável & tempo"));
    const rf=el("div","fld");
    rf.innerHTML=`<label>Responsável nesta aula</label>`;
    const ri=el("input");ri.value=e.resp||"";ri.placeholder=s.resp;
    ri.oninput=()=>{e.resp=ri.value;save();};
    rf.appendChild(ri);
    right.appendChild(rf);
    right.appendChild(el("div","tag-time","⏱ Tempo médio: "+s.tempo));
    // cronômetro (tempo real gasto nesta etapa)
    const running=!!e.timerStart;
    const timerBox=el("div","timerbox");
    timerBox.innerHTML='<span class="timer-lbl">⏲ Tempo gasto:</span> <b class="timer-live" data-aula="'+a.id+'" data-eid="'+s.id+'">'+fmtDur(timerCur(e))+'</b>';
    const bTimer=el("button","btn sm "+(running?"timer-stop":"timer-go"),running?"⏸ Pausar":"▶ Iniciar");
    bTimer.onclick=()=>{const ee=a.etapas[s.id];
      if(ee.timerStart){ee.timeSpent=(ee.timeSpent||0)+(Date.now()-ee.timerStart);ee.timerStart=null;}
      else{ee.timerStart=Date.now();}
      save();render();};
    timerBox.appendChild(document.createTextNode(" "));timerBox.appendChild(bTimer);
    right.appendChild(timerBox);

    right.appendChild(el("div","block-lbl","Arquivos / links"));
    const linksWrap=el("div","links");
    function drawLinks(){
      linksWrap.innerHTML="";
      (e.links||[]).forEach((lk,i)=>{
        const chip=el("div","link-chip");
        chip.innerHTML=`🔗 <a href="${esc(lk.url)}" target="_blank" rel="noopener">${esc(lk.label||lk.url)}</a> <span class="x">✕</span>`;
        chip.querySelector(".x").onclick=()=>{e.links.splice(i,1);save();drawLinks();};
        linksWrap.appendChild(chip);
      });
      const addRow=el("div","link-row");
      const lin=el("input");lin.placeholder="Cole um link (TEC, Drive, PDF...)";
      const badd=el("button","btn ghost sm","Add");
      badd.onclick=()=>{const v=lin.value.trim();if(!v)return;e.links.push({url:v,label:shortUrl(v)});save();drawLinks();};
      lin.onkeydown=ev=>{if(ev.key==="Enter")badd.onclick();};
      addRow.appendChild(lin);addRow.appendChild(badd);
      linksWrap.appendChild(addRow);
    }
    drawLinks();
    right.appendChild(linksWrap);

    right.appendChild(el("div","block-lbl","Notas"));
    const nf=el("div","fld");
    const ta=el("textarea");ta.value=e.notas||"";ta.placeholder="Observações, pendências, decisões...";
    ta.oninput=()=>{e.notas=ta.value;save();};
    nf.appendChild(ta);right.appendChild(nf);

    // Registro de atividades (log com data/hora)
    right.appendChild(el("div","block-lbl","Registro de atividades"));
    const logWrap=el("div","logwrap");
    function drawLog(){
      logWrap.innerHTML="";
      const entries=(e.log||[]);
      if(!entries.length){logWrap.appendChild(el("div","small muted","Sem registros ainda. Documente aqui cada coisa feita nesta etapa."));}
      entries.slice().reverse().forEach((it,ri)=>{
        const realIdx=entries.length-1-ri;
        const row=el("div","logrow");
        row.innerHTML='<div class="logts">🕘 '+fmtTs(it.ts)+'</div><div class="logtx">'+esc(it.text)+'</div>';
        const del=el("span","logx","✕");del.onclick=()=>{entries.splice(realIdx,1);save();drawLog();};
        row.appendChild(del);logWrap.appendChild(row);
      });
    }
    drawLog();right.appendChild(logWrap);
    const laRow=el("div","link-row");
    const lin=el("input");lin.placeholder="Registrar o que foi feito...";
    const badd=el("button","btn ghost sm","Registrar");
    badd.onclick=()=>{const v=lin.value.trim();if(!v)return;addLog(a,s,v);lin.value="";drawLog();};
    lin.onkeydown=ev=>{if(ev.key==="Enter")badd.onclick();};
    laRow.appendChild(lin);laRow.appendChild(badd);right.appendChild(laRow);

    g.appendChild(left);g.appendChild(right);
    box.appendChild(g);

    // IA note + run button (for steps executed by the IA)
    const isIA=/IA/.test(s.resp);
    if(isIA){
      const note=el("div","ia-note",'🤖 <b>Etapa executada pela IA.</b> Clique em “Rodar com a IA” para eu executar esta etapa pelo seu navegador/ferramentas.');
      box.appendChild(note);
    }

    // actions
    const act=el("div","step-actions");
    if(isIA){const bIA=el("button","btn ia-run","🤖 Rodar com a IA");bIA.onclick=()=>openRunIA(a,s);act.appendChild(bIA);}
    const done=e.status==="done";
    const bDone=el("button","btn "+(done?"ghost":"ok"), done?"↺ Reabrir etapa":"✓ Concluir etapa");
    bDone.onclick=()=>{
      if(done){e.status=e.checks.some(Boolean)?"doing":"todo";e.doneAt=null;}
      else{e.status="done";e.doneAt=Date.now();
        openSteps.delete(s.id);const next=curStep(a);if(next)openSteps.add(next.id);}
      save();render();
    };
    act.appendChild(bDone);
    if(!done){
      const bDo=el("button","btn ghost","Marcar como “fazendo”");
      bDo.onclick=()=>{e.status="doing";save();render();};
      if(e.status!=="doing")act.appendChild(bDo);
    }
    if(done&&e.doneAt){act.appendChild(el("span","small muted","Concluída em "+new Date(e.doneAt).toLocaleDateString("pt-BR")));}
    box.appendChild(act);
    return box;
  }

  function syncStepVisual(a,s){ // update pill + row class without full re-render
    render(); // simple: re-render keeps state (cheap enough)
  }

  function ManualBox(kind){
    const b=el("div","manual-box");
    let html=`<div class="mh">📘 Padrão do Manual</div>`;
    if(kind==="q"){
      html+=`<div>Template de questões (o que já usamos no FD05/FD06):</div><ul>
        <li>Separar por <b>tópico</b> e por <b>banca</b>; ordem <b>decrescente de ano</b>.</li>
        <li>Estrutura de comentário: <b>Resolução</b> (espaço), <b>Teoria</b> 📘, <b>Gabarito</b>.</li>
        <li>Bancas do padrão: CEBRASPE, FCC, FGV, VUNESP.</li></ul>`;
    }else if(kind==="c"){
      html+=`<div>Padrão de comentário de questões:</div><ul>${MANUAL.comentarios.map(x=>"<li>"+x+"</li>").join("")}</ul>`;
    }else if(kind==="struct"){
      html+=`<div>${MANUAL.tqr}</div><div style="margin-top:6px"><b>Estrutura da aula:</b> ${MANUAL.estrutura.join(" · ")}.</div>`;
    }else{ // full
      html+=`<ul>
        <li><b>Tipografia:</b> ${MANUAL.tipografia.join(" · ").replace(/<\/?b>/g,"")}.</li>
        <li><b>Layout:</b> A4, margens 2,5 · recuo 0 · 6pt depois · 1,15 · cabeçalho linha contínua · rodapé logo + página.</li>
        <li><b>Paleta:</b> negrito <span style="color:#0E57C4">azul = o que é</span> · negrito <span style="color:#C00000">vermelho = o que não é</span>.</li>
        <li><b>Tags/quadros:</b> ${MANUAL.tags.join(", ")}.</li></ul>`;
    }
    b.innerHTML=html;
    const more=el("button","btn ghost sm","Ver todos os padrões");more.style.marginTop="8px";
    more.onclick=openPadroes;b.appendChild(more);
    return b;
  }

  // ---------- modals ----------
  function Modals(){
    const ov=el("div","ov");ov.id="ov";
    ov.onclick=e=>{if(e.target===ov)closeModal();};
    return ov;
  }
  function showModal(node){const ov=$("#ov");ov.innerHTML="";ov.appendChild(node);ov.classList.add("show");}
  function closeModal(){const ov=$("#ov");ov.classList.remove("show");ov.innerHTML="";}

  function openNovaAula(existing){
    const isEdit=existing&&existing.id;
    const a=isEdit?existing:{titulo:"",disciplina:"",escopo:"",paginas:""};
    const m=el("div","modal");
    m.innerHTML=`<span class="mx">✕</span><h2>${isEdit?"Editar aula":"Nova aula"}</h2>
      <div class="sub muted small">Etapa 1.1 — Planejamento: título, disciplina, escopo e sugestão de páginas.</div>
      <div style="margin-top:16px">
        <div class="fld"><label>Título da aula *</label><input id="f_tit" value="${esc(a.titulo)}" placeholder="Ex.: FD06 — Consultas e Comandos em SQL"></div>
        <div class="fld"><label>Disciplina / posição no curso</label><input id="f_disc" value="${esc(a.disciplina)}" placeholder="Ex.: Banco de Dados"></div>
        <div class="fld"><label>Escopo (tópicos que entram / ficam de fora)</label><textarea id="f_esc" placeholder="Ex.: SQL e subdivisões; Lógica de três estados. Fora: administração de SGBD.">${esc(a.escopo)}</textarea></div>
        <div class="fld"><label>Sugestão de nº de páginas</label><input id="f_pag" value="${esc(a.paginas||"")}" placeholder="Ex.: 60"></div>
      </div>
      <div class="foot"><button class="btn ghost" id="f_cancel">Cancelar</button><button class="btn" id="f_save">${isEdit?"Salvar":"Criar aula"}</button></div>`;
    m.querySelector(".mx").onclick=closeModal;
    m.querySelector("#f_cancel").onclick=closeModal;
    m.querySelector("#f_save").onclick=()=>{
      const tit=m.querySelector("#f_tit").value.trim();
      if(!tit){m.querySelector("#f_tit").focus();return;}
      const data={titulo:tit,disciplina:m.querySelector("#f_disc").value.trim(),
        escopo:m.querySelector("#f_esc").value.trim(),paginas:m.querySelector("#f_pag").value.trim()};
      if(isEdit){Object.assign(existing,data);save();closeModal();render();}
      else{const na=ensure(Object.assign({id:uid(),criadaEm:Date.now(),etapas:{}},data));completeStep1(na);DB.aulas.push(na);save();closeModal();openAula(na.id);}
    };
    showModal(m);
    setTimeout(()=>m.querySelector("#f_tit").focus(),30);
  }

  function openTransformar(){
    const m=el("div","modal");
    m.innerHTML=`<span class="mx">✕</span><h2>↺ Transformar aula antiga em nova</h2>
      <div class="sub muted small">Reaproveita uma aula/material já existente e roda o processo de atualização pelas mesmas etapas (novas questões, teoria atualizada, re-padronização).</div>
      <div style="margin-top:16px">
        <div class="fld"><label>Aula / material antigo (link ou referência) *</label><input id="t_orig" placeholder="Ex.: NFE — aula 2022 (link do Drive / PDF antigo)"></div>
        <div class="fld"><label>Título da nova aula *</label><input id="t_tit" placeholder="Ex.: NFE — Nota Fiscal Eletrônica (2026)"></div>
        <div class="fld"><label>Disciplina / posição no curso</label><input id="t_disc" placeholder="Ex.: Legislação / Sistemas fiscais"></div>
        <div class="fld"><label>O que atualizar (escopo da transformação)</label><textarea id="t_esc" placeholder="Novas provas/questões, mudanças de legislação, novos tópicos, re-padronização visual..."></textarea></div>
        <div class="fld"><label>Sugestão de nº de páginas</label><input id="t_pag" placeholder="Ex.: 60"></div>
      </div>
      <div class="foot"><button class="btn ghost" id="t_cancel">Cancelar</button><button class="btn" id="t_save">Criar transformação</button></div>`;
    m.querySelector(".mx").onclick=closeModal;
    m.querySelector("#t_cancel").onclick=closeModal;
    m.querySelector("#t_save").onclick=()=>{
      const tit=m.querySelector("#t_tit").value.trim();
      const orig=m.querySelector("#t_orig").value.trim();
      if(!orig){m.querySelector("#t_orig").focus();return;}
      if(!tit){m.querySelector("#t_tit").focus();return;}
      const na=ensure({id:uid(),criadaEm:Date.now(),etapas:{},tipo:"transformacao",origem:orig,
        titulo:tit,disciplina:m.querySelector("#t_disc").value.trim(),
        escopo:m.querySelector("#t_esc").value.trim(),paginas:m.querySelector("#t_pag").value.trim()});
      completeStep1(na);DB.aulas.push(na);save();closeModal();openAula(na.id);
    };
    showModal(m);
    setTimeout(()=>m.querySelector("#t_orig").focus(),30);
  }

  const IA_HINTS={
    e3:"Entro no TEC pelo seu navegador, localizo as favoritas da aula e crio os cadernos: geral da aula, gerais por banca (CEBRASPE/FCC/FGV), por tópico, por tópico por banca e questões integradas por banca — dentro de uma pasta, seguindo o padrão da SI01.",
    e4:"Exporto de 100 a 200 questões dos cadernos e monto o Word no template (por tópico e banca, ano decrescente), com espaço de Resolução, Teoria e Gabarito — como fiz no FD05/FD06.",
    e5:"Produzo a teoria dos tópicos (orientada para prova), com definições, comparações e exemplos, pronta para os comentários.",
    e7:"Aplico o template visual ao PDF de teoria e gero o arquivo auxiliar de trechos reutilizáveis nos comentários.",
    e8:"Comento as questões no padrão editorial (resolução, correção da assertiva, teoria, gabarito), reutilizando trechos da teoria.",
    e9:"Monto os três PDFs (Teoria, Questões, Revisão) com consistência visual e o Essencial de Prova + esquemas + mapa mental.",
    e11:"Transformo a teoria em slides por tópico, com esquemas e 10–15 questões, mantendo a identidade visual."
  };
  function openRunIA(a,s){
    const cmd="Claude, rode a etapa "+s.num+" — "+s.nome+" da aula \""+a.titulo+"\".";
    const m=el("div","modal");
    m.innerHTML=`<span class="mx">✕</span><h2>🤖 Rodar etapa ${esc(s.num)} com a IA</h2>
      <div class="sub muted small">${esc(s.nome)}</div>
      <div class="ia-note" style="margin-top:14px">${esc(IA_HINTS[s.id]||s.obj)}</div>
      <div class="block-lbl" style="margin-top:14px">Como rodar</div>
      <div class="small muted">Este sistema é um painel — quem executa sou eu no chat do Claude. Copie o comando abaixo e cole no chat:</div>
      <div class="cmd" id="ia-cmd">${esc(cmd)}</div>
      <div class="foot"><button class="btn ghost" id="ia-copy">Copiar comando</button><button class="btn" id="ia-ok">Entendi</button></div>`;
    m.querySelector(".mx").onclick=closeModal;
    m.querySelector("#ia-ok").onclick=closeModal;
    m.querySelector("#ia-copy").onclick=()=>{try{navigator.clipboard.writeText(cmd);m.querySelector("#ia-copy").textContent="Copiado ✓";}catch(e){}};
    showModal(m);
  }

  function openPadroes(){
    const m=el("div","modal modal-wide");
    const secs=[
      ["Tipografia",list(MANUAL.tipografia)],
      ["Layout e formatação",list(MANUAL.layout)],
      ["Paleta TI TOTAL (destaques)",list(MANUAL.paleta)],
      ["Tags e quadros",MANUAL.tags.map(t=>`<span class="badge-tag">${t}</span>`).join("")],
      ["Estrutura da aula",list(MANUAL.estrutura)],
      ["Organização das seções",list(MANUAL.secoes)],
      ["Padrão de comentários de questões",list(MANUAL.comentarios)],
      ["Metodologia",`<p>${MANUAL.tqr}</p>`]
    ];
    m.innerHTML=`<span class="mx">✕</span><h2>Padrões do Manual TI TOTAL</h2>
      <div class="sub muted small">Referência rápida para padronizar toda aula. Baseado no Manual de Produção de Aulas.</div>
      <div style="margin-top:14px" id="refs"></div>`;
    m.querySelector(".mx").onclick=closeModal;
    const refs=m.querySelector("#refs");
    secs.forEach((s,i)=>{
      const sec=el("div","ref-sec"+(i===0?" open":""));
      sec.innerHTML=`<h4>▸ ${s[0]}</h4><div class="rb">${s[1]}</div>`;
      sec.querySelector("h4").onclick=()=>sec.classList.toggle("open");
      refs.appendChild(sec);
    });
    showModal(m);
  }
  function list(arr){return "<ul>"+arr.map(x=>"<li>"+x+"</li>").join("")+"</ul>";}

  function shortUrl(u){try{const x=new URL(u);return x.hostname.replace("www.","")+ (x.pathname.length>1?"/…":"");}catch(e){return u.slice(0,28)+(u.length>28?"…":"");}}

  // tick dos cronômetros em andamento (atualiza só o texto, sem re-render)
  setInterval(function(){
    document.querySelectorAll('.timer-live').forEach(function(node){
      var aid=node.getAttribute('data-aula'), eid=node.getAttribute('data-eid');
      var a=DB.aulas.find(function(x){return x.id===aid;});
      if(!a||!a.etapas||!a.etapas[eid])return;
      var e=a.etapas[eid];
      if(e.timerStart)node.textContent=fmtDur(timerCur(e));
    });
  },1000);

  function __login(msg){
    document.body.innerHTML='<div style="max-width:340px;margin:14vh auto;font-family:system-ui,sans-serif;text-align:center"><h2 style="color:#002060">TI TOTAL</h2><p style="color:#666">Sistema de Produção de Aulas</p><form id="lf"><input id="lpw" type="password" placeholder="Senha" autofocus style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px"><p id="lmsg" style="color:#c0392b;min-height:1em">'+(msg||'')+'</p><button style="width:100%;padding:10px;border:0;border-radius:8px;background:#0E57C4;color:#fff;font-size:16px;cursor:pointer">Entrar</button></form></div>';
    document.getElementById('lf').onsubmit=async function(ev){ev.preventDefault();
      const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:document.getElementById('lpw').value})});
      if(r.ok)location.reload();else document.getElementById('lmsg').textContent='Senha incorreta';};
  }
  async function __init(){try{const r=await fetch('/api/db',{cache:'no-store',credentials:'include'});if(r.status===401)return __login();const d=await r.json();DB=(d&&Array.isArray(d.aulas))?d:{aulas:[]};}catch(e){DB={aulas:[]};}render();}
  __init();
})();
</script>
