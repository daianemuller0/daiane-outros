<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sistema de Produção de Aulas — TI TOTAL</title>
</head>
<body>
<div id="app-root"></div>
<style>
  :root{
    --navy:#002060; --navy2:#14275C; --blue:#0E57C4; --blue-soft:#2E5BD6;
    --ice:#EAF1FB; --line:#E2E8F0; --ink:#1B2430; --muted:#64748B;
    --ok:#1E8E3E; --ok-soft:#E7F5EC; --warn:#C77700; --warn-soft:#FCF3E3;
    --red:#C00000; --bg:#F4F7FC; --card:#FFFFFF;
    --font-title:"Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-body:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  #app-root{font-family:var(--font-body);color:var(--ink);background:var(--bg);min-height:100vh;font-size:15px;line-height:1.5}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  h1,h2,h3,h4,.t{font-family:var(--font-title);letter-spacing:.2px}
  a{color:var(--blue);text-decoration:none}
  button{font-family:var(--font-body);cursor:pointer;border:none;border-radius:9px;font-size:14px}
  .btn{background:var(--blue);color:#fff;padding:10px 16px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .btn:hover{background:var(--blue-soft)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.ok{background:var(--ok)} .btn.ok:hover{filter:brightness(1.05)}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #f0c9c9}
  /* painéis de tópicos */
  .pnl{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .pnl-sum{font-size:12px;font-weight:700;color:var(--blue);margin:8px 0}
  .pnl-tools{margin:6px 0}.pnl-paste{margin:8px 0}.pnl-paste textarea{width:100%;margin:6px 0}
  .tcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:#fbfcff}
  .tcard.ok{border-color:#bfe5cf;background:#f4fbf7}.tcard.cur{border-color:var(--blue);box-shadow:0 0 0 2px #dbe8ff}.tcard.dim{opacity:.65}
  .tcard-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .tname{flex:1;font-weight:700}.tname-ro{flex:1}
  .tpill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e9edf5;color:#55607a}
  .tpill.ok{background:#d8f3e5;color:#1a7f4b}.tpill.warn{background:#fff0cc;color:#9a6a00}
  .subrow{display:flex;align-items:center;gap:6px;margin:4px 0}
  .subrow input.subname{flex:1;min-width:0}.subrow input.subpag{width:78px}
  .subrow.rem input{text-decoration:line-through;opacity:.5}
  .obadge{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
  .obadge.ia{background:#ede4ff;color:#6d28d9}.obadge.vc{background:#dff1ff;color:#0E57C4}
  .tcard-a{display:flex;gap:8px;margin-top:8px}
  .tnote{background:#fff7e0;border-left:3px solid #e29a00;padding:6px 10px;border-radius:6px;font-size:13px;margin:6px 0}
  .pnl .x{cursor:pointer;color:#a33;padding:0 6px}
  .pnl .err{color:#c0392b}
  .stepper{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .stp{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;background:#eef1f7;color:#55607a;border:1px solid transparent}
  .stp.cur{background:#e3ecff;color:var(--blue);border-color:var(--blue)}.stp.done{background:#d8f3e5;color:#1a7f4b}
  .sublbl{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--navy);margin:10px 0 4px}
  .sub2{border:1px solid var(--line);border-left:4px solid #c9d2e6;border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
  .sub2.aprovado{border-left-color:#1a9d5a;background:#f4fbf7}.sub2.removido{border-left-color:#c0392b;background:#fdf3f2}
  .sub2.removido .sub2-nome b{text-decoration:line-through;opacity:.6}
  .sub2-top{display:flex;gap:8px;align-items:flex-start}.sub2-nome{flex:1}
  .sub2-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .seg{padding:6px 11px;font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:#55607a}
  .seg.ap.on{background:#1a9d5a;color:#fff;border-color:#1a9d5a}.seg.rm.on{background:#c0392b;color:#fff;border-color:#c0392b}
  .seg.cm.on{border-color:var(--blue);color:var(--blue)}.seg:disabled,.btn:disabled{opacity:.5;cursor:not-allowed}
  .subqs{flex:1;min-width:160px}
  .sub2-top .subname{flex:1;min-width:0;font-weight:700}
  .sub2-ctl .subpag{width:90px}
  .tnote.ok{background:#eaf7f0;border-left-color:#1a9d5a}
  .nd .sub2{margin:6px 0}
  .sub2-cm{margin-top:8px}.sub2-cm textarea{width:100%}
  .regra{background:#fff7e0;border:1px solid #f0d58a;border-radius:9px;padding:8px 12px;font-size:13px;margin:8px 0}
  .regra .warnw{color:#c0392b;font-weight:700}
  .qs{color:#0E57C4}.tnote.warn{background:#fdecea;border-left-color:#c0392b}
  .cobre{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--navy)}
  .conclusao{background:#f4f8ff;border:1px solid #d5e4fb;border-radius:10px;padding:10px 12px;margin:10px 0}
  .conclusao-h{display:flex;justify-content:space-between;font-size:14px;color:var(--navy)}
  .conclusao .bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
  .conclusao .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
  .pipe{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .pipe-i{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef1f7;color:#8a93a8}
  .pipe-i.fei{background:#d8f3e5;color:#1a7f4b}.pipe-i.atu{background:#fff0cc;color:#9a6a00;box-shadow:0 0 0 1px #e6c66a}
  .iabox{border:1px solid #d5e4fb;background:#f9fbff;border-radius:10px;padding:10px 12px;margin:10px 0}
  .iabox-h{margin-bottom:4px}
  .txlist{margin-top:8px}.txitem{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:#fff}
  .txitem summary{cursor:pointer}
  .txview{font-size:14px;line-height:1.6;padding:6px 2px}.txview table{border-collapse:collapse;margin:8px 0;width:100%}
  .txview th,.txview td{border:1px solid var(--line);padding:5px 8px;text-align:left;font-size:13px}.txview th{background:#eef2fb}
  .tx-az{color:#0070C0;font-weight:700}.tx-vm{color:#d00000;font-weight:700}
  .pedido{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px 12px;font-size:12px;max-height:280px;overflow:auto}
  .callout{background:#fff8e1;border-left:3px solid #e29a00;padding:6px 10px;margin:8px 0;border-radius:4px;font-size:13px}
  /* header */
  header.top{background:linear-gradient(100deg,var(--navy) 0%,var(--navy2) 60%,#1c3a86 100%);color:#fff;box-shadow:0 2px 10px rgba(0,32,96,.18)}
  header.top .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .logo{display:flex;align-items:center;gap:10px;font-family:var(--font-title);font-weight:800;font-size:18px;letter-spacing:.5px}
  .logo .hex{width:30px;height:30px;border:2px solid #7fb0ff;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#bcd6ff;transform:rotate(0deg)}
  .logo small{font-weight:500;color:#b9cdf2;font-size:11px;letter-spacing:2px;display:block;margin-top:-3px}
  header.top nav{margin-left:auto;display:flex;gap:6px}
  header.top nav button{background:rgba(255,255,255,.08);color:#eaf1fb;padding:8px 14px;font-weight:600}
  header.top nav button.active,header.top nav button:hover{background:rgba(255,255,255,.20);color:#fff}
  /* layout */
  .page{padding:26px 0 60px}
  .pagehead{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead h1{font-size:24px;margin:0;color:var(--navy)}
  .pagehead .sub{color:var(--muted);font-size:14px}
  .spacer{flex:1}
  /* cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(16,32,64,.05)}
  .aula-card{cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .aula-card:hover{border-color:var(--blue);box-shadow:0 6px 20px rgba(14,87,196,.12);transform:translateY(-2px)}
  .aula-card .disc{font-size:12px;color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .aula-card h3{margin:4px 0 8px;font-size:18px;color:var(--navy)}
  .aula-card .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .prog{height:9px;background:var(--ice);border-radius:20px;overflow:hidden}
  .prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));border-radius:20px;transition:width .4s}
  .prog-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:8px;color:var(--muted)}
  .prog-row b{color:var(--navy)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill.todo{background:#eef1f6;color:#5b6b82}
  .pill.doing{background:var(--warn-soft);color:var(--warn)}
  .pill.done{background:var(--ok-soft);color:var(--ok)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  /* empty */
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px}
  /* new-aula card */
  .new-card{border:2px dashed #c3d3ec;background:#fbfdff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--blue);cursor:pointer;min-height:150px;font-weight:700;text-align:center;padding:16px}
  .new-card:hover{border-color:var(--blue);background:#f2f7ff}
  .new-card .plus{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:24px}
  .new-card.transform{border-color:#e7c58a;color:var(--warn);background:#fffdf7}
  .new-card.transform:hover{border-color:var(--warn);background:#fff8ec}
  .new-card.transform .plus{background:var(--warn);font-size:20px}
  .badge-transf{display:inline-flex;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .origem-box{background:#fff8ec;border:1px solid #f0dcb5;border-radius:9px;padding:8px 11px;font-size:12.5px;color:#8a5a00;margin-top:8px}
  /* aula detail */
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13.5px;margin-bottom:12px;cursor:pointer}
  .backlink:hover{color:var(--blue)}
  .aula-hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:20px;display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .aula-hero .disc{font-size:12px;color:var(--blue);font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .aula-hero h1{margin:3px 0 6px;font-size:23px;color:var(--navy)}
  .aula-hero .esc{color:var(--muted);font-size:13.5px;max-width:620px}
  .ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--ice) 0);flex-shrink:0}
  .ring .in{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.1}
  .ring .in b{font-size:22px;color:var(--navy);font-family:var(--font-title)}
  .ring .in span{font-size:10.5px;color:var(--muted)}
  /* stepper */
  .trilha-h{font-family:var(--font-title);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue);font-weight:800;margin:22px 0 8px;padding-left:2px;display:flex;align-items:center;gap:10px}
  .trilha-h:before{content:"";height:1px;background:var(--line);flex:1;order:2}
  .step{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;transition:.15s}
  .step.done{border-left:4px solid var(--ok)}
  .step.doing{border-left:4px solid var(--warn)}
  .step.todo{border-left:4px solid #cdd7e6}
  .step-head{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
  .step-head:hover{background:#fafcff}
  .step-num{width:38px;height:38px;border-radius:10px;background:var(--ice);color:var(--navy);font-family:var(--font-title);font-weight:800;display:grid;place-items:center;font-size:13px;flex-shrink:0}
  .step.done .step-num{background:var(--ok);color:#fff}
  .step.doing .step-num{background:var(--warn);color:#fff}
  .step-head .nm{font-weight:700;color:var(--navy);font-size:15.5px}
  .step-head .rp{font-size:12.5px;color:var(--muted);margin-top:2px}
  .step-head .chev{margin-left:auto;color:var(--muted);transition:.2s;font-size:13px}
  .step.open .chev{transform:rotate(90deg)}
  .step-body{display:none;padding:4px 20px 20px 20px;border-top:1px solid var(--line);background:#fcfdff}
  .step.open .step-body{display:block}
  .grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
  .block-lbl{font-family:var(--font-title);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:16px 0 7px}
  .obj{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px}
  .chk{list-style:none;margin:0;padding:0}
  .chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 2px;border-bottom:1px dashed #eef2f8}
  .chk li:last-child{border-bottom:none}
  .chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--ok);flex-shrink:0;cursor:pointer}
  .chk label{cursor:pointer;font-size:14px}
  .chk li.on label{color:var(--muted);text-decoration:line-through}
  .exit{background:var(--ok-soft);border:1px solid #cdead6;border-radius:10px;padding:11px 14px;font-size:13.5px;color:#1c6b34}
  .exit b{color:var(--ok)}
  .manual-box{background:linear-gradient(180deg,#f0f6ff,#f7fbff);border:1px solid #d5e4fb;border-radius:11px;padding:13px 15px;font-size:13px;margin-top:6px}
  .manual-box .mh{font-family:var(--font-title);font-weight:800;color:var(--blue);font-size:12px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .manual-box ul{margin:6px 0 0;padding-left:18px} .manual-box li{margin:3px 0}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:var(--font-body);font-size:14px;color:var(--ink);background:#fff}
  .fld textarea{min-height:66px;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,87,196,.12)}
  .links{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .link-row{display:flex;gap:6px}
  .link-row input{flex:1}
  .link-chip{display:inline-flex;align-items:center;gap:6px;background:var(--ice);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--navy);margin:3px 6px 3px 0}
  .link-chip a{font-weight:600}
  .link-chip .x{cursor:pointer;color:var(--muted);font-weight:700}
  .btn.ia-run{background:linear-gradient(100deg,#6d28d9,#7c3aed);color:#fff}
  .btn.ia-run:hover{filter:brightness(1.08)}
  .ia-badge{display:inline-flex;align-items:center;gap:4px;background:#ede9fe;color:#6d28d9;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:.2px;margin-left:8px}
  .ia-note{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:11px 14px;font-size:13px;color:#5b21b6;margin-top:6px}
  .cmd{background:#faf5ff;border:1px dashed #c4b5fd;border-radius:8px;padding:9px 11px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#4c1d95;margin:8px 0;word-break:break-word}
  .logwrap{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .logrow{position:relative;background:#fff;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:7px 26px 7px 10px}
  .logts{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .logtx{font-size:13px;color:var(--ink);white-space:pre-wrap}
  .logx{position:absolute;top:6px;right:8px;cursor:pointer;color:#c3ccda;font-weight:700;font-size:12px}
  .logx:hover{color:var(--red)}
  .step-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .tag-time{font-size:12px;color:var(--muted);background:#f1f5fb;padding:3px 9px;border-radius:7px}
  .timerbox{margin-top:8px;font-size:12px;color:var(--muted);background:#f1f5fb;padding:5px 9px;border-radius:7px;display:flex;align-items:center;gap:7px}
  .timerbox .timer-lbl{white-space:nowrap}
  .timerbox .timer-live{color:var(--ink);font-variant-numeric:tabular-nums}
  .btn.timer-go{background:#0E57C4;color:#fff;border-color:#0E57C4}
  .btn.timer-stop{background:#fdecec;color:#b42318;border-color:#f3b9b4}
  .uploadbox{margin-top:14px;padding:14px;border:1.5px dashed var(--blue);border-radius:12px;background:#f7faff}
  .uploadbox .btn.upbtn{margin-top:10px;background:#0E57C4;color:#fff;border-color:#0E57C4}
  .upstatus{margin-top:8px} .upstatus.err{color:#b42318}
  .uplist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .uprow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .uprow a{color:var(--blue);font-weight:600;text-decoration:none}
  .uprow .x{margin-left:auto;cursor:pointer;color:var(--muted);font-weight:700}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 4px;color:var(--navy);font-size:20px}
  .modal .mx{float:right;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;margin:-6px -4px 0 0}
  .modal-wide{max-width:760px}
  .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  /* padroes reference */
  .ref-sec{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .ref-sec > h4{margin:0;padding:12px 16px;background:#f7faff;font-size:14px;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:8px}
  .ref-sec .rb{padding:8px 16px 14px;font-size:13.5px;display:none}
  .ref-sec.open .rb{display:block}
  .ref-sec ul{margin:6px 0;padding-left:18px} .ref-sec li{margin:4px 0}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:5px}
  .badge-tag{display:inline-block;background:var(--ice);color:var(--navy);border-radius:7px;padding:3px 9px;margin:3px 5px 3px 0;font-size:12.5px;font-weight:600}
  .kb{font-size:12px;color:var(--muted);margin-top:6px}
  .metrics{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 18px}
  .metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px}

let __saveT=null;function save(){clearTimeout(__saveT);__saveT=setTimeout(()=>{fetch('/api/db',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)}).then(r=>{if(r.status===401)location.reload();}).catch(()=>{});},250);}
  function getAula(id){return DB.aulas.find(a=>a.id===id);}
  function blankEtapa(){return {status:"todo",resp:"",checks:[],notas:"",links:[],doneAt:null};}
  function ensure(a){ // migrate/ensure etapa objects
    a.etapas=a.etapas||{};
    if(!a.etapas.e4s&&a.etapas.e5&&a.etapas.e5.status!=="todo"){a.etapas.e4s=Object.assign(blankEtapa(),{status:"done",doneAt:Date.now(),notas:"Etapa criada depois; considerada concluída porque a teoria já estava em andamento."});}

      const e=a.etapas[s.id]; if(!Array.isArray(e.checks))e.checks=[]; if(!Array.isArray(e.links))e.links=[]; if(!Array.isArray(e.log))e.log=[];
      if(typeof e.timeSpent!=='number')e.timeSpent=0;
      if(e.timerStart&&(Date.now()-e.timerStart)>288e5)e.timerStart=null; // descarta cronômetro esquecido (>8h)
    });
    return a;
  }
  function addLog(a,s,text){const e=a.etapas[s.id];e.log=e.log||[];e.log.push({ts:Date.now(),text:text});save();}
  function fmtTs(ts){const d=new Date(ts);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
  function fmtSize(n){n=n||0;if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(0)+" KB";return (n/1048576).toFixed(1)+" MB";}
  function UploadBox(a,s,e){
    const titulo=s.uploadTitulo||"⬆ Enviar arquivo para a IA (ex.: caderno em PDF com gabarito)";
    const desc=s.uploadDesc||"O arquivo que você subir aqui fica salvo no sistema e a IA consegue ler direto — sem precisar do chat.";
    if(!Array.isArray(e.uploads))e.uploads=[];
    const box=el("div","uploadbox");
    box.appendChild(el("div","block-lbl",esc(titulo)));
    box.appendChild(el("div","small muted",esc(desc)));
    const status=el("div","upstatus small");
    const list=el("div","uplist");
    function draw(){
      list.innerHTML="";
      if(!e.uploads.length){list.appendChild(el("div","small muted","Nenhum arquivo enviado ainda."));return;}
      e.uploads.forEach((u,i)=>{
        const row=el("div","uprow");
        row.innerHTML='📄 <a href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(u.name)+'</a> <span class="small muted">('+fmtSize(u.size)+')</span>';
        const x=el("span","x","✕");x.onclick=()=>{e.uploads.splice(i,1);save();draw();};
        row.appendChild(x);list.appendChild(row);
      });
    }
    const fi=el("input");fi.type="file";fi.accept=".pdf,.doc,.docx,.txt";fi.style.display="none";
    const btn=el("button","btn upbtn","⬆ Subir arquivo");
    btn.onclick=()=>fi.click();
    fi.onchange=async()=>{
      const f=fi.files[0];if(!f)return;
      status.className="upstatus small";status.textContent="Enviando "+f.name+"…";
      try{
        const blobMod=await import('https://esm.sh/@vercel/blob@2.8.0/client');
        const pth='uploads/'+safeSeg(a.id)+'/'+safeSeg(f.name);
        const bl=await blobMod.upload(pth,f,{access:'public',handleUploadUrl:'/api/upload',multipart:f.size>8*1024*1024});
        const d={ok:true,name:safeSeg(f.name),size:f.size,url:bl.url};
        if(d&&d.ok){
          const ex=e.uploads.findIndex(u=>u.name===d.name);const rec={name:d.name,size:d.size,url:d.url,ts:Date.now()};
          if(ex>=0)e.uploads[ex]=rec;else e.uploads.push(rec);
          addLog(a,s,"Arquivo enviado no sistema: "+d.name+" ("+fmtSize(d.size)+").");
          save();draw();status.textContent="✓ Enviado: "+d.name;
        }else{status.className="upstatus small err";status.textContent="Erro ao enviar o arquivo.";}
      }catch(err){
        status.className="upstatus small err";
        status.textContent="⚠ Não foi possível enviar o arquivo: "+(err&&err.message?err.message:"erro desconhecido");
      }
      fi.value="";
    };
    box.appendChild(btn);box.appendChild(fi);box.appendChild(status);box.appendChild(list);
    // sincroniza com o servidor (arquivos já enviados)
    fetch('/api/uploads?aula='+encodeURIComponent(safeSeg(a.id)),{credentials:'include'}).then(r=>r.json()).then(d=>{
      if(d&&Array.isArray(d.files)){const names=new Set(e.uploads.map(u=>u.name));
        d.files.forEach(f=>{if(!names.has(f.name))e.uploads.push({name:f.name,size:f.size,url:f.url});});draw();}
    }).catch(()=>{});
    draw();
    return box;
  }
  function fmtDur(ms){const m=Math.floor((ms||0)/60000);if(m<60)return m+"min";return Math.floor(m/60)+"h "+(m%60)+"min";}
  function timerCur(e){return (e.timeSpent||0)+(e.timerStart?(Date.now()-e.timerStart):0);}
  function progress(a){ensure(a);let d=0;STEPS.forEach(s=>{if(a.etapas[s.id].status==="done")d++;});return {done:d,total:STEPS.length,pct:Math.round(d/STEPS.length*100)};}
  // criar a aula no painel JÁ é a etapa 1.1 (Planejamento) -> marca como concluída
  function completeStep1(a){const s=STEPS.find(x=>x.id==="e1");const e=a.etapas.e1;

  function statusOf(a,s){return a.etapas[s.id].status;}
  function curStep(a){for(const s of STEPS){if(a.etapas[s.id].status!=="done")return s;}return null;}
  function openAula(id){const a=getAula(id);ensure(a);openSteps=new Set();const c=curStep(a);if(c)openSteps.add(c.id);view={name:"aula",aulaId:id};render();scrollTop();}

  const root=$("#app-root");

  function Header(){

  function Painel(w){
    const ph=el("div","pagehead");
    ph.innerHTML=`<div><h1>Painel de produção</h1><div class="sub">Acompanhe cada aula pelas etapas do processo TI TOTAL.</div></div><div class="spacer"></div>`;
    const nb=el("button","btn","+ Nova aula");nb.onclick=()=>openNovaAula();ph.appendChild(nb);
    w.appendChild(ph);

    // metrics
    const tot=DB.aulas.length;
    let concl=0,andamento=0;
    DB.aulas.forEach(a=>{const p=progress(a);if(p.pct===100)concl++;else if(p.done>0)andamento++;});
    if(tot){
      const m=el("div","metrics");
      m.innerHTML=`
        <div class="metric"><b>${tot}</b><span>aula(s) no sistema</span></div>
        <div class="metric"><b>${andamento}</b><span>em andamento</span></div>
        <div class="metric"><b>${concl}</b><span>concluída(s)</span></div>`;
      w.appendChild(m);
    }

    const grid=el("div","grid");
    const nc=el("div","card new-card");
    nc.innerHTML=`<div class="plus">+</div><div>Nova aula</div>`;
    nc.onclick=()=>openNovaAula();grid.appendChild(nc);

    const tc=el("div","card new-card transform");
    tc.innerHTML=`<div class="plus">↺</div><div>Transformar aula<br>antiga em nova</div>`;
    tc.onclick=()=>openTransformar();grid.appendChild(tc);

    DB.aulas.slice().reverse().forEach(a=>{grid.appendChild(AulaCard(a));});
    w.appendChild(grid);

    if(!tot){

  // ---------- Tópicos / sub-tópicos / teoria por partes ----------
  const norm=x=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  function novoTopico(nome){return {id:uid(),nome:nome,subs:[],subStatus:"vazio",subComentario:"",teoria:{status:"aguardando",versao:1,arquivos:[],links:[],notas:"",revComentario:"",historico:[]}};}
  function topicosOf(a){
    if(!Array.isArray(a.topicos)){
      const base=(a.escopo||"").split(/\.\s|\.$/)[0];
      a.topicos=base.split(/[;,]/).map(x=>x.trim()).filter(x=>x&&x.length<80).map(novoTopico);
      save();
    }
    a.topicos.forEach(t=>{if(!t.teoria)t.teoria=novoTopico("").teoria;if(!Array.isArray(t.subs))t.subs=[];if(!t.teoria.arquivos)t.teoria.arquivos=[];if(!t.teoria.links)t.teoria.links=[];if(!t.teoria.historico)t.teoria.historico=[];});
    return a.topicos;
  }
  function addLicao(a,obj){DB.licoes=DB.licoes||[];DB.licoes.push(Object.assign({ts:Date.now(),aulaId:a.id,aula:a.titulo||"",disciplina:a.disciplina||""},obj));save();}
  function safeSeg(x){return String(x||"").replace(/[^\w\-. ()À-ſ]/g,"_");}
  async function blobUpload(a,f){
    const blobMod=await import("https://esm.sh/@vercel/blob@2.8.0/client");
    const bl=await blobMod.upload("uploads/"+safeSeg(a.id)+"/"+safeSeg(f.name),f,{access:"public",handleUploadUrl:"/api/upload",multipart:f.size>8*1024*1024});
    return {name:safeSeg(f.name),size:f.size,url:bl.url,ts:Date.now()};
  }
  function wordQuestoes(a){const up=[];["e4"].forEach(k=>{const x=a.etapas&&a.etapas[k];if(x&&x.uploads)up.push(...x.uploads);});return up.filter(u=>/\.docx?$/i.test(u.name));}

    return b;

  // arquivos que a IA deixou no sistema (api/entregas) aparecem na etapa para download
  function aplicarEntregas(E){
    if(!E||!E.aulas)return;let mudou=false;
    DB.aulas.forEach(a=>{
      const ea=E.aulas[a.id];if(!ea)return;ensure(a);
      Object.keys(ea).forEach(eid=>{
        const e=a.etapas[eid];if(!e)return;
        e.uploads=e.uploads||[];e.entregasVistas=e.entregasVistas||[];
        ea[eid].forEach(f=>{

          e.uploads.push({name:f.name,size:f.size,url:f.url,ts:Date.now(),ia:true});
          e.entregasVistas.push(f.name);mudou=true;
        });
      });

  // ---------- sumário em árvore (tópicos > sub-tópicos > itens) ----------
  function novoNo(nome){return {id:uid(),nome:nome,pag:"",qs:"",comentario:"",subs:[],origem:"humano",estado:"aprovado"};}
  function parseQs(str){return (String(str||"").match(/\d+/g)||[]).map(Number);}
  function qsDoNo(n){const st=new Set(parseQs(n.qs));(n.subs||[]).forEach(c=>qsDoNo(c).forEach(x=>st.add(x)));return st;}
  function flatNos(subs,prefixo){const out=[];(subs||[]).forEach((n,i)=>{const num=prefixo+"."+(i+1);out.push({num:num,nome:n.nome,pag:n.pag,qs:n.qs,comentario:n.comentario,nivel:num.split(".").length,node:n});out.push(...flatNos(n.subs,num));});return out;}
  function subsAtivas(t,ti){return flatNos(t.subs,String((ti||0)+1));}
  function contaNos(subs){return (subs||[]).reduce((n,x)=>n+1+contaNos(x.subs),0);}
  function fmtQs(set){return Array.from(set).sort((a,b)=>a-b).map(x=>"Q"+x).join(", ");}
  // mapa de questões do Word por item do sumário (public/mapas.json, feito pela IA)
  function aplicarMapa(M){
    if(!M||!M.aulas)return false;let mudou=false;
    DB.aulas.forEach(a=>{
      const ma=M.aulas[a.id];if(!ma)return;
      topicosOf(a).forEach(t=>{
        const mt=Object.keys(ma.topicos).find(k=>norm(k)===norm(t.nome));if(!mt)return;
        const info=ma.topicos[mt];t.totalQ=info.total;
        const nos={};Object.keys(info.nos).forEach(k=>{nos[norm(k)]=info.nos[k];});
        (function rec(arr){arr.forEach(n=>{
          const q=nos[norm(n.nome)];
          if(q&&!n.qsManual){const v=q.map(x=>"Q"+x).join(", ");if(n.qs!==v){n.qs=v;n.qsIA=true;mudou=true;}}
          rec(n.subs||[]);});})(t.subs);
      });
    });
    if(mudou)save();return mudou;
  }
  // importa o sumário colado/enviado (1., 1.1, 1.2.1 …) e cria a estrutura dos tópicos
  function importarSumario(a,texto){
    const linhas=texto.replace(/[⁠​‌‍﻿­]/g,"").replace(/ /g," ").split(/\r?\n/);
    const antigos=topicosOf(a);const memo={};
    antigos.forEach(t=>{(function rec(arr){arr.forEach(n=>{memo[norm(n.nome)]=n;rec(n.subs||[]);});})(t.subs);});
    const novos=[];let pilha=[];let nNos=0;
    linhas.forEach(l=>{
      const m=/^\s*(\d+(?:\.\d+)*)\.?\s+(.+?)\s*$/.exec(l);if(!m)return;
      const nivel=m[1].split(".").length;let rest=m[2],nome;
      if(rest.indexOf("\t")>=0){nome=rest.split("\t").map(x=>x.trim()).filter(Boolean)[0]||"";}
      else{nome=rest.replace(/\s+\d{1,3}$/,"").trim();}
      if(!nome)return;
      if(nivel===1){
        const ex=antigos.find(t=>norm(t.nome)===norm(nome));
        const t=ex||novoTopico(nome);t.nome=nome;t.subs=[];novos.push(t);pilha=[{nivel:1,ref:t}];
      }else{
        while(pilha.length&&pilha[pilha.length-1].nivel>=nivel)pilha.pop();
        const pai=pilha.length?pilha[pilha.length-1].ref:null;if(!pai)return;
        const n=novoNo(nome);const old=memo[norm(nome)];
        if(old){n.pag=old.pag||"";n.qs=old.qs||"";n.comentario=old.comentario||"";n.qsManual=old.qsManual;n.qsIA=old.qsIA;}
        pai.subs.push(n);pilha.push({nivel:nivel,ref:n});nNos++;
      }
    });
    if(!novos.length)return {ok:false};
    novos.forEach(t=>{if(t.subs.length&&t.subStatus==="vazio")t.subStatus="proposto";});
    a.topicos=novos;save();
    return {ok:true,topicos:novos.length,itens:nNos};
  }

  // ---------- produção da teoria pela IA (api/gerar) ----------
  const GEN={};  // estado em memória por tópico: {rodando,parar,feitos,total,erro,atual}
  const TXT={};  // textos gerados por tópico: {noId:{texto,ts}}
  function mdLite(src){
    const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\{\{az:(.+?)\}\}/g,'<span class="tx-az">$1</span>').replace(/\{\{vm:(.+?)\}\}/g,'<span class="tx-vm">$1</span>');
    const lines=String(src||"").split(/\r?\n/);let out="",i=0;
    while(i<lines.length){
      const l=lines[i];
      if(/^\s*\|/.test(l)){const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++;}
        const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        const body=rows.filter(r=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(r));
        out+="<table>"+body.map((r,k)=>"<tr>"+cells(r).map(c=>"<"+(k?"td":"th")+">"+inl(c)+"</"+(k?"td":"th")+">").join("")+"</tr>").join("")+"</table>";continue;}
      if(/^\s*[-*•]\s+/.test(l)){out+="<ul>";while(i<lines.length&&/^\s*[-*•]\s+/.test(lines[i])){out+="<li>"+inl(lines[i].replace(/^\s*[-*•]\s+/,""))+"</li>";i++;}out+="</ul>";continue;}
      if(!l.trim()){i++;continue;}
      if(/^\s*\[figura[^\]]*\]\s*$/i.test(l)){out+='<p><b style="background:#fff200">[figura]</b></p>';i++;continue;}
      const mq=/^\s*>\s*\[([^\]]+)\]\s*:?\s*(.*)$/.exec(l);
      if(mq){out+='<div class="callout"><b>'+esc(mq[1])+":</b> "+inl(mq[2])+"</div>";i++;continue;}
      out+="<p>"+inl(l)+"</p>";i++;
    }
    return out;
  }
  function itensDoTopico(t,ti){
    const itens=flatNos(t.subs,String(ti+1)).map(x=>({id:x.node.id,num:x.num,nome:x.nome,node:x.node,temFilhos:(x.node.subs||[]).length>0,tipo:"item"}));
    itens.push({id:"essencial",num:"Essencial de Prova",nome:"Essencial de Prova",node:null,temFilhos:false,tipo:"essencial"});
    return itens;
  }
  async function carregarTextos(a,t){
    try{const r=await fetch("/api/texto?aula="+encodeURIComponent(a.id)+"&topico="+encodeURIComponent(t.id),{credentials:"include",cache:"no-store"});
      if(r.ok){const d=await r.json();TXT[t.id]=d.nos||{};}}catch(e){}
    return TXT[t.id]||{};
  }
  function corpoPedido(a,t,ti,itens,k,tx,sumario,orient,opt){
    const it=itens[k];const T=t.teoria;const refazer=!!(opt&&opt.refazer);
    const feitosAntes=itens.slice(0,k).filter(x=>x.tipo==="item"&&tx[x.id]).map(x=>x.num+" "+x.nome+": "+String(tx[x.id].texto||"").replace(/\s+/g," ").slice(0,160)+"…");
    return {aulaId:a.id,aula:a.titulo,disciplina:a.disciplina||"",topico:t.nome,topicoId:t.id,topicoIdx:ti+1,
      sumario:sumario,no:{id:it.id,num:it.num,nome:it.nome,temFilhos:it.temFilhos},tipo:it.tipo,
      qs:it.node?parseQs(it.node.qs):(function(){const s=new Set();t.subs.forEach(n=>qsDoNo(n).forEach(x=>s.add(x)));return Array.from(s);})(),
      anteriores:feitosAntes.slice(-8),
      orientacoes:orient.concat(it.node&&it.node.comentario?["Sobre este item: "+it.node.comentario]:[]).join("\n"),
      feedback:(opt&&opt.feedback)||"",textoAnterior:refazer&&tx[it.id]?tx[it.id].texto:"",versao:T.versao};
  }
  function contextoGeracao(a,t){
    const licoes=(DB.licoes||[]).filter(l=>l.aulaId===a.id&&l.tipo==="revisao-teoria"&&l.comentario).slice(-6).map(l=>"- ("+l.topico+") "+l.comentario);
    return [t.subComentario?"Sobre o tópico: "+t.subComentario:"",licoes.length?"Comentários das revisões anteriores nesta aula (aprenda com eles):\n"+licoes.join("\n"):""].filter(Boolean);
  }
  async function verPedido(a,t,ti){
    const itens=itensDoTopico(t,ti);const tx=await carregarTextos(a,t);
    let k=itens.findIndex(x=>!tx[x.id]);if(k<0)k=0;
    const sumario=itens.filter(x=>x.tipo==="item").map(x=>x.num+" "+x.nome);
    const body=corpoPedido(a,t,ti,itens,k,tx,sumario,contextoGeracao(a,t),{});
    const r=await fetch("/api/gerar?simular=1",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){alert(d.error||"Erro");return;}
    const m=el("div","modal modal-wide");
    m.innerHTML='<span class="mx">✕</span><h2>👁 O que será enviado à IA</h2><div class="sub muted small">Item de exemplo: '+esc(itens[k].num+" "+itens[k].nome)+' · modelo '+esc(d.modelo)+'</div>'
      +'<div class="small" style="margin:8px 0"><b>Tamanho aproximado deste pedido:</b> '+d.tokensAprox.toLocaleString("pt-BR")+' tokens de entrada ('+d.caracteres.toLocaleString("pt-BR")+' caracteres). A resposta da IA (o texto do item) vem além disso. Nenhuma chamada foi feita e nada foi cobrado.</div>'
      +'<div class="block-lbl">Instruções fixas (enviadas em todos os itens)</div><pre class="pedido">'+esc(d.sistema)+'</pre>'
      +'<div class="block-lbl">Pedido deste item</div><pre class="pedido">'+esc(d.pedido)+'</pre><div class="foot"><button class="btn" id="pd-ok">Fechar</button></div>';
    m.querySelector(".mx").onclick=closeModal;m.querySelector("#pd-ok").onclick=closeModal;showModal(m);
  }
  async function gerarTopico(a,t,ti,redraw,opt){
    const g=GEN[t.id]=GEN[t.id]||{};if(g.rodando)return;
    const T=t.teoria;const itens=itensDoTopico(t,ti);
    g.rodando=true;g.parar=false;g.erro="";g.total=itens.length;
    const tx=await carregarTextos(a,t);
    const refazer=!!(opt&&opt.refazer);
    g.feitos=refazer?0:itens.filter(x=>tx[x.id]).length;
    const sumario=itens.filter(x=>x.tipo==="item").map(x=>x.num+" "+x.nome);
    const orient=contextoGeracao(a,t);
    redraw();
    for(let k=0;k<itens.length;k++){
      const it=itens[k];
      if(g.parar)break;
      if(!refazer&&tx[it.id])continue;
      g.atual=it.num+" "+it.nome;redraw();
      const body=corpoPedido(a,t,ti,itens,k,tx,sumario,orient,opt);
      try{
        const r=await fetch("/api/gerar",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        const d=await r.json().catch(()=>({}));
        if(!r.ok)throw new Error(d.error||("Erro "+r.status));
        tx[it.id]={texto:d.texto,ts:Date.now()};g.feitos++;
        T.tokIn=(T.tokIn||0)+((d.usage&&d.usage.entrada)||0);T.tokOut=(T.tokOut||0)+((d.usage&&d.usage.saida)||0);save();
        if(d.truncado)g.aviso="Um item foi cortado por tamanho; refaça-o se precisar.";
      }catch(e){g.erro="Parou em “"+it.num+" "+it.nome+"”: "+e.message;break;}
      redraw();
    }
    g.rodando=false;g.atual="";
    if(!g.erro&&!g.parar&&g.feitos>=g.total){T.geradoEm=Date.now();T.versaoGerada=T.versao;addLog(a,STEPS.find(x=>x.id==="e5"),"Teoria gerada pela IA: "+t.nome+" (v"+T.versao+").");save();}
    redraw();
  }
  function blocoIA(a,t,ti,card,redraw,T){
    const g=GEN[t.id]=GEN[t.id]||{};
    const itens=itensDoTopico(t,ti);
    const tx=TXT[t.id]||{};
    const feitosN=g.rodando?g.feitos:itens.filter(x=>tx[x.id]).length;
    const pct=Math.round(feitosN/itens.length*100);
    const box=el("div","iabox");
    box.appendChild(el("div","iabox-h","<b>🤖 Produção pela IA</b>"+(T.tokOut?' <span class="small muted">· '+(T.tokIn||0).toLocaleString("pt-BR")+" tokens de entrada / "+(T.tokOut||0).toLocaleString("pt-BR")+" de saída (v"+T.versao+")</span>":"")));
    const bar=el("div","conclusao");
    bar.innerHTML='<div class="conclusao-h"><span>Itens escritos</span><span>'+feitosN+" de "+itens.length+" · "+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>'+(g.rodando&&g.atual?'<div class="small">✍️ Escrevendo: '+esc(g.atual)+"…</div>":"");
    box.appendChild(bar);
    if(g.erro)box.appendChild(el("div","tnote warn","⚠ "+esc(g.erro)));
    if(g.aviso)box.appendChild(el("div","tnote",esc(g.aviso)));
    const ultimo=T.historico.length?T.historico[T.historico.length-1]:null;
    const temAjuste=ultimo&&ultimo.acao==="ajustes"&&T.versaoGerada!==T.versao;
    const ac=el("div","tcard-a");

    }else{
      if(feitosN<itens.length){
        const b=el("button","btn sm",(feitosN?"▶ Continuar produção":"🤖 Produzir este tópico com a IA"));
        b.onclick=()=>gerarTopico(a,t,ti,redraw,{});ac.appendChild(b);
      }

        b2.onclick=()=>gerarTopico(a,t,ti,redraw,{refazer:true,feedback:ultimo.comentario});ac.appendChild(b2);
      }else if(feitosN===itens.length){
        const b3=el("button","btn ghost sm","↻ Refazer tudo");
        b3.onclick=()=>{if(confirm("Refazer todos os itens deste tópico? Os textos atuais serão substituídos."))gerarTopico(a,t,ti,redraw,{refazer:true});};ac.appendChild(b3);
      }
    }
    const bv=el("button","btn ghost sm","👁 Ver o que será enviado");bv.onclick=()=>verPedido(a,t,ti);ac.appendChild(bv);
    box.appendChild(ac);
    // textos gerados
    if(Object.keys(tx).length){
      const lst=el("div","txlist");
      itens.forEach(it=>{
        const x=tx[it.id];if(!x)return;
        const d=el("details","txitem");
        d.innerHTML="<summary><b>"+esc(it.num===it.nome?it.nome:it.num+" "+it.nome)+"</b>"+(x.editado?' <span class="small muted">(editado)</span>':"")+"</summary>";
        const view=el("div","txview");view.innerHTML=mdLite(x.texto);d.appendChild(view);
        const bar2=el("div","tcard-a");
        const be=el("button","btn ghost sm","✏ Editar");
        be.onclick=()=>{
          view.innerHTML="";const ta=el("textarea");ta.rows=12;ta.value=x.texto;ta.style.width="100%";view.appendChild(ta);
          be.style.display="none";const bs=el("button","btn ok sm","Salvar");
          bs.onclick=async()=>{const r=await fetch("/api/texto",{method:"PUT",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({aulaId:a.id,topicoId:t.id,noId:it.id,texto:ta.value})});
            if(r.ok){x.texto=ta.value;x.editado=true;redraw();}else alert("Não foi possível salvar.");};
          bar2.appendChild(bs);};
        bar2.appendChild(be);d.appendChild(bar2);lst.appendChild(d);
      });
      box.appendChild(lst);
    }else if(!TXT[t.id]){carregarTextos(a,t).then(()=>{if(Object.keys(TXT[t.id]||{}).length)redraw();});}
    card.appendChild(box);
    return itens.every(x=>tx[x.id]);
  }

  function TeoriaPanel(a,s,e){
    const box=el("div","pnl");
    function syncDone(tops){
      const all=tops.length&&tops.every(t=>t.teoria.status==="aprovado");
      if(all&&e.status!=="done"){e.status="done";e.doneAt=Date.now();save();render();return true;}
      if(!all&&e.status==="done"){e.status="doing";e.doneAt=null;save();render();return true;}
      if(!all&&e.status==="todo"&&tops.some(t=>t.teoria.status!=="aguardando")){e.status="doing";save();render();return true;}
      return false;
    }
    function hist(t,acao,comentario){t.teoria.historico.push({ts:Date.now(),acao:acao,versao:t.teoria.versao,comentario:comentario||""});}
    function draw(){
      const tops=topicosOf(a);
      box.innerHTML="";
      box.appendChild(el("div","block-lbl","📚 Produção da teoria, um tópico por vez"));
      box.appendChild(el("div","small muted","Cada tópico passa por revisão humana e você pode produzir os tópicos na ordem que quiser. Seus comentários de revisão servem para a IA aprender e acertar melhor nos tópicos seguintes."));
      box.appendChild(regraQuestoes(a));
      if(!tops.length){box.appendChild(el("div","small muted","Nenhum tópico cadastrado. Defina os tópicos e sub-tópicos na etapa 1.4.2."));return;}
      const PCT={aguardando:0,producao:33,revisao:66,aprovado:100};

        const dt=el("details","small");dt.innerHTML="<summary>Sumário deste tópico ("+at.length+" itens)</summary>"+(at.length?at.map(x=>'<div style="margin-left:'+((x.nivel-2)*14)+'px">'+esc(x.num)+" "+esc(x.nome)+(x.pag?" ("+esc(x.pag)+"p)":"")+(x.qs?' <span class="qs">📎 '+esc(x.qs)+"</span>":"")+"</div>").join(""):"<div>—</div>");
        card.appendChild(dt);

          card.appendChild(br);box.appendChild(card);return;

        if(st==="aguardando"){

          b.onclick=()=>{T.status="producao";hist(t,"iniciado","");addLog(a,s,"Produção iniciada: "+t.nome);save();if(!syncDone(tops))draw();};

          const ct=el("textarea");ct.rows=3;ct.value=T.revComentario||"";ct.placeholder="Ex.: muito extenso; faltou destacar pegadinhas; usar mais quadros comparativos…";
          ct.oninput=()=>{T.revComentario=ct.value;save();};cm.appendChild(ct);card.appendChild(cm);

          lt.oninput=()=>{T.lacunas=lt.value;save();};lf.appendChild(lt);card.appendChild(lf);
          const ac=el("div","tcard-a");

          bok.onclick=()=>{T.status="aprovado";hist(t,"aprovado",T.revComentario);
            addLicao(a,{tipo:"revisao-teoria",decisao:"aprovado",topico:t.nome,versao:T.versao,subtopicos:at.map(x=>x.num+" "+x.nome),coberturaQuestoes:true,comentario:T.revComentario||""});
            addLog(a,s,"Tópico aprovado: "+t.nome+(T.versao>1?" (v"+T.versao+")":""));if(!syncDone(tops))draw();};
          const baj=el("button","btn danger sm","↩ Pedir ajustes");
          baj.onclick=()=>{if(!(T.revComentario||"").trim()&&!(T.lacunas||"").trim()){alert("Escreva o que precisa ser ajustado (comentário ou lacunas das questões do Word) — é isso que a IA usa para melhorar.");return;}

            addLicao(a,{tipo:"revisao-teoria",decisao:"ajustes",topico:t.nome,versao:T.versao,subtopicos:at.map(x=>x.num+" "+x.nome),comentario:c});
            T.status="producao";T.versao++;T.revComentario="";T.lacunas="";T.cobertura=false;save();draw();};

    function filesRow(T,editable,redraw){
      const w=el("div","links");
      T.arquivos.forEach((u,i)=>{const c=el("div","link-chip");c.innerHTML='📄 <a href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(u.name)+"</a>"+(editable?' <span class="x">✕</span>':"");
        if(editable)c.querySelector(".x").onclick=()=>{T.arquivos.splice(i,1);save();redraw();};w.appendChild(c);});
      T.links.forEach((u,i)=>{const c=el("div","link-chip");c.innerHTML='🔗 <a href="'+esc(u.url)+'" target="_blank" rel="noopener">'+esc(u.label||u.url)+"</a>"+(editable?' <span class="x">✕</span>':"");
        if(editable)c.querySelector(".x").onclick=()=>{T.links.splice(i,1);save();redraw();};w.appendChild(c);});
      return w;
    }
    function uploadRow(a,T,redraw){
      const r=el("div","link-row");
      const fi=el("input");fi.type="file";fi.accept=".pdf,.doc,.docx,.txt";fi.style.display="none";
      const bu=el("button","btn ghost sm","⬆ Anexar arquivo");const st=el("span","small muted","");
      bu.onclick=()=>fi.click();
      fi.onchange=async()=>{const f=fi.files[0];if(!f)return;st.textContent="Enviando…";
        try{T.arquivos.push(await blobUpload(a,f));save();redraw();}catch(err){st.textContent="Erro: "+(err&&err.message||"falha no envio");}};
      const li=el("input");li.placeholder="…ou cole um link (Drive, etc.)";
      const bl=el("button","btn ghost sm","Add");
      bl.onclick=()=>{const v=li.value.trim();if(!v)return;T.links.push({url:v,label:shortUrl(v)});save();redraw();};
      r.appendChild(bu);r.appendChild(fi);r.appendChild(st);r.appendChild(li);r.appendChild(bl);return r;
    }
    draw();return box;
  }

      <div style="margin-top:14px" id="refs"></div>`;
    m.querySelector(".mx").onclick=closeModal;
    const refs=m.querySelector("#refs");
    secs.forEach((s,i)=>{
      const sec=el("div","ref-sec"+(i===0?" open":""));
      sec.innerHTML=`<h4>▸ ${s[0]}</h4><div class="rb">${s[1]}</div>`;
      sec.querySelector("h4").onclick=()=>sec.classList.toggle("open");
      refs.appendChild(sec);
    });
    showModal(m);
  }
  function list(arr){return "<ul>"+arr.map(x=>"<li>"+x+"</li>").join("")+"</ul>";}

  function shortUrl(u){try{const x=new URL(u);return x.hostname.replace("www.","")+ (x.pathname.length>1?"/…":"");}catch(e){return u.slice(0,28)+(u.length>28?"…":"");}}

  // tick dos cronômetros em andamento (atualiza só o texto, sem re-render)
  setInterval(function(){
    document.querySelectorAll('.timer-live').forEach(function(node){
      var aid=node.getAttribute('data-aula'), eid=node.getAttribute('data-eid');
      var a=DB.aulas.find(function(x){return x.id===aid;});
      if(!a||!a.etapas||!a.etapas[eid])return;
      var e=a.etapas[eid];
      if(e.timerStart)node.textContent=fmtDur(timerCur(e));
    });
  },1000);

  function __login(msg){
    document.body.innerHTML='<div style="max-width:340px;margin:14vh auto;font-family:system-ui,sans-serif;text-align:center"><h2 style="color:#002060">TI TOTAL</h2><p style="color:#666">Sistema de Produção de Aulas</p><form id="lf"><input id="lpw" type="password" placeholder="Senha" autofocus style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px"><p id="lmsg" style="color:#c0392b;min-height:1em">'+(msg||'')+'</p><button style="width:100%;padding:10px;border:0;border-radius:8px;background:#0E57C4;color:#fff;font-size:16px;cursor:pointer">Entrar</button></form></div>';
    document.getElementById('lf').onsubmit=async function(ev){ev.preventDefault();
      const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:document.getElementById('lpw').value})});
      if(r.ok)location.reload();else document.getElementById('lmsg').textContent='Senha incorreta';};
  }
  async function __init(){try{const r=await fetch('/api/db',{cache:'no-store',credentials:'include'});if(r.status===401)return __login();const d=await r.json();DB=(d&&Array.isArray(d.aulas))?d:{aulas:[]};}catch(e){DB={aulas:[]};}
    try{const er=await fetch('/api/entregas',{cache:'no-store',credentials:'include'});if(er.ok)aplicarEntregas(await er.json());}catch(e){}
    try{const mr=await fetch('/mapas.json',{cache:'no-store'});if(mr.ok){window.__MAPAS=await mr.json();aplicarMapa(window.__MAPAS);}}catch(e){}
    render();}
  __init();
})();
</script>
